openapi: 3.1.0
info:
  title: AI Agent 健康接口
  version: 0.1.0
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      summary: 检查后端服务是否运行
      responses:
        "200":
          description: 服务正常
          headers:
            X-Request-ID:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [status, service, request_id]
                additionalProperties: false
                properties:
                  status:
                    type: string
                    const: ok
                  service:
                    type: string
                    const: ai-agent-api
                  request_id:
                    type: string
