spring:
  application:
    name: guo-ai-agent-langchain4j

server:
  port: 8123
  servlet:
    context-path: /api

langchain4j:
  enabled: ${LANGCHAIN4J_ENABLED:false}
  api-key: ${DASHSCOPE_API_KEY:}
  model-name: ${DASHSCOPE_MODEL_NAME:deepseek-v4-flash-0731}
  memory-messages: 20
  mcp:
    enabled: ${MCP_ENABLED:false}
    image-sse-url: ${IMAGE_MCP_SSE_URL:http://localhost:8127/sse}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: default
      paths-to-match: /**
      packages-to-scan: com.xiaoguo.guaiagent.controller

knife4j:
  enable: true
  setting:
    language: zh_cn

search-api:
  api-key: ${SEARCH_API_KEY:}

logging:
  level:
    dev.langchain4j: INFO
